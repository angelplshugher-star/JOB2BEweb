            else state[key] = value;
            render();
        }

        function setView(viewName, target = null) {
            state.view = viewName;
            if (target) state.targetView = target;
            window.scrollTo(0, 0);
            render();

        function toggleSupportMenu() {
            state.isSupportOpen = !state.isSupportOpen;
            if (!state.isSupportOpen) state.supportSubView = null;
            render();

        function toggleTransport(label) {
            if (state.search.transports.includes(label)) {

            render();

            const ALL_APPLICATIONS = [
                { id: 1, title: 'Product Analyst', company: 'SCBX', logo: 'S', status: 'นัดสัมภาษณ์', date: '23 ก.ย. 2026', currentStep: 2, match: 88, tech: 85, culture: 90, problem: 82 },

                { id: 3, title: 'Frontend Developer', company: 'BuildIt Fast', logo: 'B', status: 'ไม่ผ่าน', date: '15 ก.ย. 2026', currentStep: 3, match: 75, tech: 80, culture: 70, problem: 60, rejected: true },

            const filteredApps = ALL_APPLICATIONS.filter(app => {

                return app.status === activeFilter;

            return `
                <div class="min-h-screen bg-[#FAFAFA] animate-in fade-in py-12">

                                        </div>
                                    </div>
                                </div>
                            `).join('')}

                    </div>
                </div>
            `;
        }

                            ` : subView === 'faq' ? `
                                <div class="space-y-2 max-h-60 overflow-y-auto pr-1">
                                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                        <p class="font-bold text-slate-700 mb-1">Q: AI Matching ทำงานอย่างไร?</p>
                                        <p class="text-slate-500">ระบบจะนำ Resume และแบบทดสอบมาวิเคราะห์จับคู่กับตำแหน่งงาน</p>
                                    </div>
                                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">
                                        <p class="font-bold text-slate-700 mb-1">Q: มีค่าใช้จ่ายในการใช้งานไหม?</p>
                                        <p class="text-slate-500">ผู้หางานสามารถใช้บริการวิเคราะห์และสมัครงานได้ฟรี 100%</p>
                                    </div>
                                    <button onclick="setSupportSubView(null)" class="text-xs text-slate-400 hover:underline block text-center w-full pt-2">← กลับเมนูหลัก</button>
                                </div>
                            ` : `
                                <div class="space-y-2">
                                    <button onclick="setSupportSubView('chat')" class="w-full p-3 bg-gradient-to-r from-pink-50 to-orange-50 hover:from-pink-100 hover:to-orange-100 border border-pink-100 rounded-2xl flex items-center gap-3 text-left transition-all group">
                                        <div class="w-10 h-10 bg-white rounded-xl flex items-center justify-center text-[#FF3F70] shadow-sm group-hover:scale-105 transition-transform">
                                            ${I.MessageSquare({size: 20})}
                                        </div>
                                        <div>
                                            <p class="font-bold text-slate-800 text-sm">แชทกับเจ้าหน้าที่</p>
                                            <p class="text-xs text-slate-500">สอบถามข้อสงสัยได้ทันที</p>

                                        </div>
                                    </button>
                                </div>
                            `}
                        </div>
                    ` : ''}

                    <button 
                        onclick="toggleSupportMenu()" 
                        class="relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95 group"

        function render() {
            const root = document.getElementById('root');
            let content = '';

            // Render Navbar if not in specific views
            if (!['auth', 'search_mode', 'assessment', 'company_assessment', 'job_detail'].includes(state.view)) {
                content += Navbar();
            }

            content += '<main class="flex-grow">';
            switch(state.view) {
                case 'home': content += HomeView(); break;
                case 'auth': content += AuthView(); break;
                case 'search_mode': content += SearchModeView(); break;
                case 'job_search': content += JobSearchView(); break;
                case 'job_detail': content += JobDetailView(); break;
                case 'assessment': 
                case 'assessment_result': content += AssessmentResultView(); break;
                case 'company_assessment': content += CompanyAssessmentView(); break;
                case 'tracking': content += TrackingView(); break;
                case 'companies': content += CompaniesView(); break;
                case 'loading': content += LoadingView(); break;
                default: content += HomeView();
            }
            content += '</main>';

            // Floating Bottom-Right Support Widget
            content += SupportWidget();

            root.innerHTML = content;
        }

        // Initial render
        render();

    </script>
