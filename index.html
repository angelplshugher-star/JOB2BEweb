        const SELF_PERCEPTION_Q1_MAPPING = {

        const calculateMaxPossibleScores = () => {
            const maxScores = {};
            QUESTS.forEach(quest => {
                const questMax = {};
                quest.choices.forEach(choice => {
                    Object.entries(choice.scores).forEach(([skill, score]) => {
                        if (!questMax[skill] || score > questMax[skill]) questMax[skill] = score;
                    });
                });
                Object.entries(questMax).forEach(([skill, score]) => {
                    maxScores[skill] = (maxScores[skill] || 0) + score;
                });
            });
            SKILLS.forEach(skill => { if (!maxScores[skill]) maxScores[skill] = 5; });
            return maxScores;
        };

        const MAX_SCORES = calculateMaxPossibleScores();

        window.selectQuest = (scoresStr, idx) => {
            const scores = JSON.parse(decodeURIComponent(scoresStr));
            state.answers[state.currentQuest] = { scores, choiceIndex: idx };
            
            const allBtns = document.querySelectorAll('.choice-btn');
            allBtns.forEach((btn, i) => {
                if (i === idx) {
                    btn.className = "choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 transition-all duration-150 flex items-start space-x-4 border-orange-400 bg-orange-50 shadow-md shadow-orange-100 scale-[1.01]";
                } else {
                    btn.className = "choice-btn w-full text-left p-4 md:p-5 rounded-2xl border-2 transition-all duration-150 flex items-start space-x-4 border-slate-100 bg-white opacity-60";
                }
            });

            saveState();

            setTimeout(() => {
                if (state.currentQuest < QUESTS.length - 1) {
                    state.currentQuest++;

                    showReveal();

            }, 180);
        };

        const calculateResults = () => {
            const normalizedScores = {};
            
            SKILLS.forEach(skill => {
                let raw = 0;
                Object.values(state.answers).forEach(ans => {
                    if (ans && ans.scores && ans.scores[skill]) raw += ans.scores[skill];
                });
                const max = MAX_SCORES[skill] || 1; 
                let norm = Math.round((raw / max) * 100); 
                normalizedScores[skill] = Math.min(100, Math.max(0, norm));
            });

            normalizedScores["Execution"] = Math.round(((normalizedScores["Planning"] || 0) + (normalizedScores["Problem Solving"] || 0)) / 2) || 0;
            normalizedScores["Leadership"] = Math.round(((normalizedScores["Decision Making"] || 0) + (normalizedScores["Communication"] || 0)) / 2) || 0;
            normalizedScores["Learning Agility"] = Math.round(((normalizedScores["Curiosity"] || 0) + (normalizedScores["Adaptability"] || 0)) / 2) || 0;
            normalizedScores["Independence"] = Math.round(((normalizedScores["Self-awareness"] || 0) + (normalizedScores["Initiative"] || 0)) / 2) || 0;
            normalizedScores["Prioritization"] = Math.round(((normalizedScores["Planning"] || 0) + (normalizedScores["Decision Making"] || 0)) / 2) || 0;
            normalizedScores["Organization"] = normalizedScores["Planning"] || 0;
            normalizedScores["Risk Awareness"] = normalizedScores["Risk Approach"] || 0;
            normalizedScores["Confidence"] = Math.round(((normalizedScores["Competitive Response"] || 0) + (normalizedScores["Self-awareness"] || 0)) / 2) || 0;
            normalizedScores["Responsibility"] = normalizedScores["Resilience"] || 0;

            const sortedSkills = Object.entries(normalizedScores)
                .sort((a, b) => b[1] - a[1])
                .map(entry => ({ skill: entry[0], score: entry[1] }));

            const topSkills = sortedSkills.slice(0, 5);

            let highestAnimalScore = -1;
            let primaryAnimal = null;

            Object.values(ANIMALS).forEach(animal => {
                const avgScore = animal.coreSkills.reduce((sum, skill) => sum + (normalizedScores[skill] || 0), 0) / 3;
                if (avgScore > highestAnimalScore) {
                    highestAnimalScore = avgScore;
                    primaryAnimal = animal;
                } else if (avgScore === highestAnimalScore) {
                    const currentMaxCore = Math.max(...primaryAnimal.coreSkills.map(s => normalizedScores[s] || 0));
                    const newMaxCore = Math.max(...animal.coreSkills.map(s => normalizedScores[s] || 0));
                    if (newMaxCore > currentMaxCore) primaryAnimal = animal;
                }
            });

            const perceivedSkillKeys = state.perception.map(q => SELF_PERCEPTION_Q1_MAPPING[q]);
            let hiddenSkill = null;
            for (let i = 0; i < sortedSkills.length; i++) {
                if (!perceivedSkillKeys.includes(sortedSkills[i].skill)) {
                    hiddenSkill = sortedSkills[i];
                    break;
                }
            }

            let growthSkill = sortedSkills.find(s => s.score >= 45 && s.score <= 64);
            if (!growthSkill) growthSkill = sortedSkills.find(s => s.score < 45) || sortedSkills[sortedSkills.length - 1];

            const matchedCareers = CAREER_AREAS.map(area => {
                const matchScore = area.skills.reduce((sum, skill) => sum + (normalizedScores[skill] || 0), 0) / area.skills.length;
                return { ...area, matchScore };
            }).sort((a, b) => b.matchScore - a.matchScore).slice(0, 3);

            const availableConnections = Object.values(ANIMALS).filter(a => a.id !== primaryAnimal.id);
            const connections = availableConnections.map((animal, originalIndex) => {
                const coreScores = animal.coreSkills.map(skill => normalizedScores[skill] || 0);
                const complementScore = coreScores.reduce((sum, score) => sum + (100 - score), 0) / animal.coreSkills.length;
                const synergyScore = coreScores.reduce((sum, score) => sum + score, 0) / animal.coreSkills.length;
                const compatibilityScore = (complementScore * 0.70) + (synergyScore * 0.30);
                const lowestCoreScore = Math.min(...coreScores);
                const strongestComplementIndex = coreScores.indexOf(lowestCoreScore);

                return {
                    ...animal,
                    compatibilityScore,
                    complementScore,
                    synergyScore,
                    strongestComplement: animal.coreSkills[strongestComplementIndex],
                    strongestComplementValue: 100 - lowestCoreScore,
                    originalIndex
                };
            }).sort((a, b) =>
                (b.compatibilityScore - a.compatibilityScore) ||
                (b.complementScore - a.complementScore) ||
                (b.strongestComplementValue - a.strongestComplementValue) ||
                (a.originalIndex - b.originalIndex)
            ).slice(0, 2);

            return {
                normalizedScores, sortedSkills, topSkills,
                animal: primaryAnimal, perceivedSkillKeys, hiddenSkill, growthSkill,
                careers: matchedCareers, connections
            };
        };

                            <p class="max-w-2xl mx-auto text-lg md:text-xl text-slate-600 leading-relaxed font-sarabun font-light mt-4 px-4">"${animal.narrative}"</p>
                        </section>

                        <!-- Top Skills -->
                        <section class="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl shadow-slate-100/50 border border-slate-100">
                            <h3 class="text-xs md:text-sm font-bold tracking-widest text-slate-400 uppercase flex items-center mb-6 font-prompt"><i data-lucide="target" class="w-5 h-5 mr-2 text-orange-400"></i> สัญญาณทักษะของคุณ (Your Skill Signals)</h3>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${topSkillsHtml}</div>
                            <div class="mt-5 p-4 rounded-2xl bg-slate-50 border border-slate-100">
                                <p class="text-sm text-slate-600 leading-relaxed font-sarabun"><span class="font-bold text-slate-800">คะแนนนี้อ่านยังไง?</span> คะแนน 0–100 คือ <span class="font-bold">ระดับแนวโน้มทักษะ (Skill Tendency)</span> จากคำตอบใน Quiz นี้ ไม่ใช่เปอร์เซ็นต์ความเก่งหรือคะแนนสอบ ถ้าได้ 100 หมายถึงคำตอบของคุณแสดงแนวโน้มของทักษะนั้นเต็มเพดานที่คำถามชุดนี้เปิดให้แสดง</p>
                            </div>
                        </section>

                        <!-- Hidden Skill Connection -->
                        <section class="relative overflow-hidden">
                            <div class="absolute inset-0 bg-gradient-to-br from-pink-500 via-orange-500 to-yellow-500 rounded-[2rem] opacity-10"></div>
                            <div class="bg-white/80 backdrop-blur-sm p-6 md:p-10 rounded-[2rem] border border-orange-100 relative z-10 shadow-lg">
                                <h3 class="text-xs md:text-sm font-bold tracking-widest text-pink-600 uppercase mb-6 flex items-center font-prompt"><i data-lucide="sparkles" class="w-5 h-5 mr-2"></i> ทักษะที่ซ่อนอยู่ (The Hidden Connection)</h3>
                                <div class="flex flex-col md:flex-row gap-4 mb-6">
                                    <div class="flex-1 space-y-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-100">
                                        <p class="text-xs text-slate-400 uppercase tracking-widest font-prompt font-bold">สิ่งที่คุณคิดว่าตัวเองเป็น</p>
                                        <p class="text-lg text-slate-700 font-medium font-sarabun">💬 ${perceivedSkillsText}</p>
                                    </div>
                                    <div class="flex-1 space-y-2 bg-gradient-to-br from-pink-50 to-orange-50 p-5 rounded-2xl shadow-sm border border-orange-100">
                                        <p class="text-xs text-orange-500 uppercase tracking-widest font-prompt font-bold">สิ่งที่การตัดสินใจเปิดเผย</p>
                                        <p class="text-lg text-pink-600 font-bold font-sarabun">💡 ${hiddenSkill?.skill || perceivedSkillKeys[0]}</p>
                                    </div>
                                </div>
                                <p class="text-base md:text-lg text-slate-700 leading-relaxed font-sarabun border-l-4 border-pink-400 pl-4 py-2">
                                    คุณอาจไม่ได้มองว่า <span class="font-semibold text-pink-600">${hiddenSkill?.skill}</span> คือจุดเด่นที่สุดของคุณ แต่การเลือกในสถานการณ์ต่างๆ แสดงให้เห็นว่าคุณมักจะใช้ทักษะนี้เป็นอาวุธลับเสมอ 
                                    ${perceptionMatchesBehavior ? "ซึ่งมันสอดคล้องกับสิ่งที่คุณรู้จักเกี่ยวกับตัวเองเป็นอย่างดี!" : "บางทีจุดแข็งของคุณอาจมีมากกว่าที่คุณมักจะสังเกตเห็น"}
                                </p>
                            </div>
                        </section>

                        <!-- Skill to Grow -->
                        <section class="bg-white p-6 md:p-8 rounded-[2rem] shadow-xl shadow-slate-100/50 border border-slate-100">
                            <h3 class="text-xs md:text-sm font-bold tracking-widest text-slate-400 uppercase mb-6 flex items-center font-prompt"><i data-lucide="refresh-ccw" class="w-5 h-5 mr-2 text-slate-400"></i> ทักษะที่ควรพัฒนา (Skill to Grow)</h3>
                            <div class="mb-4 flex items-center flex-wrap gap-3">
                                <span class="text-2xl md:text-3xl font-bold text-slate-800 font-prompt">${growthSkill?.skill}</span>
                                <span class="px-3 py-1 bg-slate-100 text-slate-600 rounded-full text-xs font-medium font-sarabun">กำลังพัฒนา (Developing)</span>
                            </div>
                            <p class="text-slate-600 text-base md:text-lg mb-6 leading-relaxed font-sarabun">การเพิ่มโครงสร้างในการใช้ <span class="font-semibold text-slate-800">${growthSkill?.skill}</span> จะช่วยสร้างสมดุลให้กับวิธีการทำงาน และเปลี่ยนไอเดียให้กลายเป็นผลลัพธ์ที่เป็นรูปธรรมได้มากขึ้น</p>
                            <div class="bg-orange-50/80 border-l-4 border-orange-400 p-5 rounded-r-xl">
                                <p class="text-sm font-bold text-orange-700 mb-1 font-prompt">💡 วิธีนำไปปรับใช้จริง (Try this):</p>
                                <p class="text-slate-700 text-base font-sarabun">${actionableTip}</p>
                            </div>
                        </section>

                        <!-- Career Matching -->
                        <section class="space-y-6">
                            <h3 class="text-xs md:text-sm font-bold tracking-widest text-slate-400 uppercase flex items-center font-prompt"><i data-lucide="compass" class="w-5 h-5 mr-2 text-orange-400"></i> สายงานที่น่าสำรวจ (Career Areas to Explore)</h3>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">${careersHtml}</div>
                        </section>

                        <!-- Wild Connections -->
                        <section class="space-y-6">
                            <h3 class="text-xs md:text-sm font-bold tracking-widest text-slate-400 uppercase flex items-center font-prompt"><i data-lucide="users" class="w-5 h-5 mr-2 text-pink-500"></i> คู่หูสัตว์ที่ทำงานร่วมกันได้ดี (Wild Connections)</h3>
                            <p class="text-slate-600 text-sm md:text-base font-sarabun">เมื่อคุณต้องทำงานเป็นทีม ตัวตนของคุณสามารถคอมพลีเมนต์ (Complement) กับสัตว์ประเภทอื่นๆ ได้อย่างลงตัว ดังนี้:</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">${connectionsHtml}</div>
                        </section>

                        <section class="p-5 md:p-6 rounded-[1.75rem] bg-orange-50/70 border border-orange-100">
                            <p class="text-xs font-bold tracking-widest text-orange-500 uppercase font-prompt">ABOUT YOUR RESULT</p>
                            <h3 class="text-lg font-bold text-slate-800 mt-1 font-prompt">ผลนี้เอาไปใช้ทำอะไรได้บ้าง?</h3>
                            <p class="text-sm text-slate-600 mt-2 leading-relaxed font-sarabun">JOB2BE ในเวอร์ชันนี้เป็น Quiz เพื่อช่วยให้คุณลองสังเกตตัวเองผ่านสถานการณ์ต่าง ๆ ว่ามีทักษะหรือรูปแบบการทำงานด้านไหนที่เด่นและน่าสนใจ รวมถึงด้านที่อาจลองพัฒนาต่อ ผลลัพธ์ไม่ได้ใช้รับรองระดับความสามารถและไม่ได้กำหนดว่าคุณต้องทำอาชีพใด แต่ใช้เป็นจุดเริ่มต้นในการรู้จักตัวเอง สำรวจสายงาน และมองหาทักษะที่อยากพัฒนาต่อได้</p>
                        </section>

                        <!-- Explore All Wild Types: collapsed by default -->
                        <section class="space-y-4">
                            <button type="button"
                                onclick="window.toggleWildTypes()"
                                class="w-full rounded-[1.75rem] border border-orange-100 bg-gradient-to-r from-orange-50 via-white to-pink-50 p-5 md:p-6 flex items-center justify-between gap-4 text-left shadow-sm hover:shadow-md transition-all">
                                <div class="min-w-0">
                                    <p class="text-[10px] md:text-xs font-bold tracking-widest text-orange-500 uppercase font-prompt">EXPLORE THE WILD TYPES</p>
                                    <h3 class="text-xl md:text-2xl font-bold text-slate-800 mt-1 font-prompt">รู้จักสัตว์ทั้ง 9 แบบ</h3>
                                    <p id="wild-types-hint" class="text-sm text-slate-500 mt-1 font-sarabun">อยากรู้ว่าสัตว์ตัวอื่นมีทักษะและนิสัยแบบไหน? กดเพื่อเปิดดู</p>
                                </div>
                                <div id="wild-types-toggle-icon" class="w-11 h-11 rounded-full bg-white shadow-sm border border-orange-100 flex items-center justify-center flex-shrink-0 transition-transform duration-300">
                                    <i data-lucide="chevron-down" class="w-5 h-5 text-orange-500"></i>
                                </div>
                            </button>

                            <div id="wild-types-panel" class="hidden">
                                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 pt-1">
                                    ${allAnimalsHtml}
                                </div>
                                <button type="button" onclick="window.toggleWildTypes(false)"
                                    class="mt-4 mx-auto flex items-center gap-2 px-5 py-2.5 rounded-full bg-slate-100 text-slate-600 text-sm font-semibold font-sarabun hover:bg-slate-200 transition-colors">
                                    <i data-lucide="chevron-up" class="w-4 h-4"></i>
                                    ปิดข้อมูลสัตว์ทั้ง 9 แบบ
                                </button>
                            </div>
                        </section>

                        <!-- Single Profile Card and Actions -->
                        <section class="pt-8 font-prompt flex flex-col items-center">
                            
                            <!-- Single Profile Card (HTML render only - no duplicate img) -->
                            <div class="w-full max-w-[420px] mx-auto">
                                <div id="capture-card" class="relative bg-gradient-to-b from-white via-slate-50 to-orange-50/40 p-7 rounded-[2.5rem] shadow-2xl border-4 border-white ring-1 ring-slate-100 overflow-hidden font-sarabun">
                                    
                                    <!-- Background Patterns -->
                                    <div class="absolute top-0 left-0 right-0 h-32 bg-gradient-to-r from-pink-500/10 via-orange-500/15 to-yellow-500/10 -z-0"></div>
                                    <div class="absolute -top-12 -right-12 w-40 h-40 bg-pink-200/50 rounded-full blur-2xl pointer-events-none"></div>
                                    <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-orange-200/50 rounded-full blur-2xl pointer-events-none"></div>
                                    
                                    <!-- Top Ribbon -->
                                    <div class="relative z-10 flex justify-between items-center mb-6 pb-3 border-b border-slate-200/60">
                                        <div class="flex items-center space-x-2">
                                            <span class="w-2.5 h-2.5 rounded-full bg-pink-500"></span>
                                            <span class="text-[10px] font-bold tracking-widest uppercase text-slate-500 font-prompt">WILD TYPE CERTIFIED</span>
                                        </div>
                                        <span class="text-[10px] font-bold px-2.5 py-0.5 rounded-full bg-orange-100 text-orange-700 font-sarabun">JOB2BE QUEST</span>
                                    </div>

                                    <!-- Main Character Badge -->
                                    <div class="text-center mb-6 relative z-10">
                                        <div class="inline-block relative">
                                            <div class="w-24 h-24 mx-auto rounded-full bg-gradient-to-tr from-pink-400 via-orange-400 to-yellow-300 p-1 shadow-lg shadow-orange-200">
                                                <div class="w-full h-full bg-white rounded-full flex items-center justify-center text-5xl">
                                                    ${animal.emoji}
                                                </div>
                                            </div>
                                            <span class="absolute -bottom-2 left-1/2 -translate-x-1/2 bg-slate-900 text-white text-[9px] font-bold px-3 py-0.5 rounded-full uppercase tracking-wider font-prompt">
                                                ${animal.id}
                                            </span>
                                        </div>
                                        
                                        <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mt-4 mb-1 font-sarabun">ผลการประเมินตัวตนของ</p>
                                        <h2 class="${cardNameSize} font-extrabold text-slate-800 tracking-tight font-prompt whitespace-nowrap leading-tight max-w-full mx-auto px-1">${cleanDisplayName}</h2>
                                        
                                        <div class="inline-block mt-2 px-3 py-1 rounded-full bg-gradient-to-r from-pink-500 to-orange-500 text-white font-bold text-[10px] sm:text-[11px] shadow-sm font-sarabun whitespace-nowrap max-w-full overflow-hidden text-ellipsis">
                                            ${animal.title}
                                        </div>
                                    </div>
                                    
                                    <!-- Narrative Statement -->
                                    <div class="bg-white/80 backdrop-blur-sm p-4 rounded-2xl border border-orange-100 relative z-10 mb-5 shadow-sm">
                                        <p class="text-xs text-slate-700 font-sarabun italic leading-relaxed text-center">
                                            "${animal.narrative}"
                                        </p>
                                    </div>

                                    <!-- Key Traits -->
                                    <div class="space-y-3 mb-6 relative z-10 font-sarabun">
                                        <div class="bg-white p-3.5 rounded-2xl border border-slate-100 shadow-sm">
                                            <p class="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-2 font-sarabun flex items-center">
                                                <i data-lucide="zap" class="w-3 h-3 mr-1 text-orange-500"></i> ทักษะโดดเด่นสูงสุด (TOP SIGNALS)
                                            </p>
                                            <div class="flex flex-wrap gap-1.5">
                                                ${topSkills.slice(0,3).map(s => `
                                                    <span class="text-xs font-semibold px-2.5 py-1 bg-gradient-to-r from-pink-50 to-orange-50 border border-orange-100 text-slate-800 rounded-lg flex items-center justify-between flex-grow">
                                                        <span>${s.skill}</span>
                                                        <span class="text-pink-600 font-bold ml-1.5">${s.score}%</span>
                                                    </span>
                                                `).join('')}
                                            </div>
                                        </div>

                                        <div class="grid grid-cols-2 gap-2">
                                            <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
                                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sarabun">ทักษะที่ซ่อนอยู่</p>
                                                <p class="text-xs text-pink-600 font-bold truncate">${hiddenSkill?.skill}</p>
                                            </div>
                                            <div class="bg-white p-3 rounded-2xl border border-slate-100 shadow-sm">
                                                <p class="text-[9px] font-bold text-slate-400 uppercase tracking-wider mb-1 font-sarabun">สายงานที่เข้ากันได้</p>
                                                <p class="text-xs text-slate-800 font-bold truncate">${careers[0].name.split(' (')[0]}</p>
                                            </div>
                                        </div>
                                    </div>

                                    <!-- Footer Branding -->
                                    <div class="pt-4 border-t border-slate-200/70 flex items-center justify-between relative z-10 font-sarabun">
                                        <div class="flex flex-col">
                                            <span class="text-[9px] font-bold text-slate-400 uppercase tracking-widest flex items-center">
                                                <i data-lucide="shield-check" class="w-3 h-3 mr-1 text-pink-500"></i> JOB2BE ASSESSMENT
                                            </span>
                                            <span class="text-[8px] text-slate-400 mt-0.5">18-Quest Situational Matrix</span>
                                        </div>
                                        <img src="${LOGO_URL}" alt="JOB2BE Logo" onerror="this.onerror=null; this.src='https://placehold.co/120x40/f87171/ffffff?text=JOB2BE';" class="h-8 w-auto opacity-90 object-contain mix-blend-multiply" />
                                    </div>
                                </div>
                            </div>

                            <!-- Action Buttons -->
                            <div class="flex flex-col items-center mt-8 space-y-4 w-full max-w-[400px]">
                                <button id="saveBtn" onclick="saveImage()" class="w-full flex items-center justify-center px-8 py-4 bg-gradient-to-r from-pink-500 via-orange-500 to-yellow-500 text-white font-bold rounded-full text-lg shadow-[0_10px_30px_-10px_rgba(249,115,22,0.5)] transition-all hover:scale-105 font-prompt">
                                    <i data-lucide="download" class="w-5 h-5 mr-2"></i> บันทึกรูปโปรไฟล์
                                </button>
                                <button onclick="shareLink()" class="w-full py-4 bg-white text-slate-700 border-2 border-slate-200 font-bold rounded-full text-lg hover:border-pink-300 hover:text-pink-600 transition-colors flex items-center justify-center font-prompt">
                                    <i data-lucide="share-2" class="w-5 h-5 mr-2"></i> แชร์ลิงก์
                                </button>
                                <button onclick="resetGame()" class="text-sm font-bold text-slate-400 hover:text-slate-700 transition-colors uppercase tracking-widest mt-6 pb-1 border-b border-transparent hover:border-slate-700 font-prompt">
                                    เริ่มค้นหาใหม่อีกครั้ง
                                </button>
                            </div>
                        </section>
                    </div>
                </div>
            `;
        };

        const renderUI = () => {
            const container = document.getElementById('app-container');
            let html = '';
            
            if (state.screen === 'home') html = renderHome();
            else if (state.screen === 'name') html = renderName();
            else if (state.screen === 'perception') html = renderPerception();
            else if (state.screen === 'awareness') html = renderAwareness();
            else if (state.screen === 'intro') html = renderIntro();
            else if (state.screen === 'quest') html = renderQuest();
            else if (state.screen === 'reveal') html = renderRevealScreen();
            else if (state.screen === 'result') html = renderResult();

            container.innerHTML = html;
            if (window.lucide) {
                lucide.createIcons();
            }
        };

        const initializeApp = () => {
            renderUI();
        };

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initializeApp, { once: true });
        } else {
            initializeApp();
        }
    </script>
</body>
</html>
