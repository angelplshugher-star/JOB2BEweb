        function updateState(key, subKey, value) {

        function setView(viewName, target = null) {
            // Only these five primary navigation destinations are allowed to use page transition/fade.
            const primaryTransition =
                viewName === 'home' ||
                viewName === 'search_mode' ||
                (viewName === 'loading' && target === 'assessment') ||
                viewName === 'tracking' ||
                viewName === 'companies';
            state.pageTransitionEnabled = primaryTransition;
            state.view = viewName;
            if (target) state.targetView = target;
            window.scrollTo(0, 0);
            render();

            // Google Analytics 4: track virtual page views in this single-page prototype.
            // No names, emails, resume content, card data, or other personal data are sent.
            if (typeof gtag === 'function') {
                gtag('event', 'page_view', {
                    page_title: 'JOB2BE | ' + viewName,
                    page_location: window.location.origin + window.location.pathname + '#' + viewName,
                    page_path: '/' + viewName
                });
            }
        }

        function supportAnswer(raw) {
            const q = (raw || '').trim().toLowerCase();
            if (!q) return 'พิมพ์คำถามที่อยากรู้ได้เลย เช่น “VIP ได้อะไร” หรือ “เช็กสถานะสมัครงานยังไง”';
            if (q.includes('vip') || q.includes('วีไอพี') || q.includes('99')) {
                if (q.includes('score') || q.includes('คะแนน') || q.includes('match')) return 'VIP ไม่เพิ่ม AI Match Score นะคะ สิทธิ์ VIP เน้นเพิ่มการมองเห็นโปรไฟล์ใน Featured Candidates และ Talent Search ของบริษัท เพื่อให้ HR พบโปรไฟล์ได้ง่ายขึ้น';
                if (q.includes('ฟรี') || q.includes('ทดลอง')) return 'ผู้สมัครใหม่สามารถทดลอง VIP ฟรี 7 วันใน Prototype นี้ได้ค่ะ หลังจากนั้นเลือกสมัคร ฿99/เดือน หรือแพ็กเกจรายปีได้';
                if (q.includes('ราคา') || q.includes('เท่าไหร่')) return 'JOB2BE VIP ใน Prototype ราคา ฿99/เดือน หรือ ฿1,069/ปี โดยแพ็กเกจรายปีเฉลี่ยประมาณ ฿89/เดือนค่ะ';
                return 'JOB2BE VIP ช่วยเพิ่ม Visibility ของโปรไฟล์ โดยมีโอกาสแสดงใน Featured Candidates และ Talent Search มากขึ้น แต่ไม่เพิ่มหรือเปลี่ยน AI Match Score ค่ะ';
            }
            if (q.includes('match') || q.includes('แมตช์') || q.includes('คะแนน')) return 'AI Match ช่วยดูความสอดคล้องระหว่างผู้สมัครกับงานจากข้อมูลที่เกี่ยวข้อง เช่น Skill และรูปแบบการทำงาน เพื่อใช้ประกอบการตัดสินใจ ไม่ใช่การรับประกันว่าจะได้งานค่ะ';
            if (q.includes('resume') || q.includes('เรซูเม่') || q.includes('โปรไฟล์')) return 'คุณสามารถเข้า “โปรไฟล์ของฉัน” เพื่อดูข้อมูลและอัปเดต Resume ได้ ส่วน VIP จะช่วยให้โปรไฟล์เด่นขึ้นในฝั่งบริษัท แต่ข้อมูลความเหมาะสมยังอิงจากโปรไฟล์จริงค่ะ';
            if (q.includes('สถานะ') || q.includes('สมัครงาน') || q.includes('ติดตาม')) return 'เข้าเมนู “สถานะการสมัคร” ได้เลยค่ะ หน้านั้นใช้ติดตามความคืบหน้าของงานที่คุณสมัครไว้';
            if (q.includes('แบบทดสอบ') || q.includes('career') || q.includes('วิเคราะห์') || q.includes('skill')) return 'AI Career Analysis ช่วยสะท้อน Skill รูปแบบการทำงาน และแนวโน้มงานที่เหมาะกับคุณ เพื่อให้รู้จักตัวเองก่อนเลือกงานค่ะ';
            if (q.includes('wild') || q.includes('สัตว์') || q.includes('connection')) return 'Wild Connections ใช้สัตว์แทนรูปแบบการทำงาน เพื่อช่วยอธิบายว่าจุดเด่นของคนแต่ละแบบสามารถเติมเต็มกันในการทำงานได้อย่างไรค่ะ';

        const SUPPORT_MASCOT = "https://i.ibb.co/23zcMks2/Chat-GPT-Image-Sep-23-2026-06-03-37-AM.png";
        const MASCOT_SEARCHING = "https://i.ibb.co/spmHv1bW/Chat-GPT-Image-Sep-23-2026-06-14-05-AM.png";
        const MASCOT_AI = "https://i.ibb.co/5XDkZqdp/Chat-GPT-Image-Sep-23-2026-06-14-05-AM.png";
        function mascotFallback(img){ img.onerror=null; img.src=MASCOT_AI; img.style.visibility='visible'; }
        let supportReplyTimer = null;
        function escapeSupportText(text) { return String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
        function supportScrollBottom() { const box=document.getElementById('support-chat-log'); if(!box) return; const target=box.scrollHeight-box.clientHeight; if(Math.abs(box.scrollTop-target)>2) box.scrollTop=target; }
        function supportUserBubble(text) { return `<div class="support-msg flex justify-end"><div class="max-w-[82%] bg-slate-900 text-white p-3 rounded-2xl rounded-tr-md text-xs leading-5">${escapeSupportText(text)}</div></div>`; }
        function supportBotBubble(text) { return `<div class="support-msg flex gap-2 items-start"><img src="${SUPPORT_MASCOT}" onerror="mascotFallback(this)" class="w-7 h-7 rounded-full object-cover bg-white"><div class="max-w-[82%] bg-white border p-3 rounded-2xl rounded-tl-md text-xs text-slate-600 leading-5">${escapeSupportText(text)}</div></div>`; }
        function supportTypingBubble() { return `<div id="support-typing" class="support-msg flex gap-2 items-start"><img src="${SUPPORT_MASCOT}" onerror="mascotFallback(this)" class="w-7 h-7 rounded-full object-cover bg-white"><div class="bg-white border px-4 py-3 rounded-2xl rounded-tl-md"><div class="text-[10px] text-slate-400 mb-1">กำลังพิมพ์...</div><div class="flex gap-1.5 items-center"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div></div></div>`; }
        function appendSupportExchange(message, answer) {
            const log=document.getElementById('support-chat-log');
            if(!log) return;
            log.insertAdjacentHTML('beforeend', supportUserBubble(message));
            log.insertAdjacentHTML('beforeend', supportTypingBubble());
            supportScrollBottom();
            clearTimeout(supportReplyTimer);
            const delay=Math.min(1500, Math.max(700, 500 + answer.length*7));
            supportReplyTimer=setTimeout(()=>{
                const typing=document.getElementById('support-typing');
                if(typing) typing.outerHTML=supportBotBubble(answer);
                state.supportMessages.push({role:'user', text:message},{role:'bot', text:answer});
                supportScrollBottom();
            },delay);
        }
        function sendSupportMessage() {
            const input = document.getElementById('support-chat-input');
            if (!input || !input.value.trim() || document.getElementById('support-typing')) return;
            const message = input.value.trim();
            input.value='';
            appendSupportExchange(message, supportAnswer(message));
            input.focus();
        }

        function askSupportFaq(index) {

        function updateBackToTopVisibility() {
            const btn = document.getElementById('back-to-top');
            if (!btn) return;
            const visible = window.scrollY > 420;
            btn.classList.toggle('opacity-0', !visible);
            btn.classList.toggle('translate-y-3', !visible);
            btn.classList.toggle('pointer-events-none', !visible);
            btn.classList.toggle('opacity-100', visible);
            btn.classList.toggle('translate-y-0', visible);
        }

                content += Navbar();
            }

            content += '<main class="flex-grow">';
            switch(state.view) {
                case 'home': content += HomeView(); break;
                case 'about': content += AboutView(); break;
                case 'auth': content += AuthView(); break;
                case 'search_mode': content += SearchModeView(); break;
                case 'job_search': content += JobSearchView(); break;
                case 'job_detail': content += JobDetailView(); break;
                case 'assessment': 
                case 'assessment_result': content += AssessmentResultView(); break;
                case 'ai_recommended_jobs': content += AIRecommendedJobsView(); break;
                case 'company_assessment': content += CompanyAssessmentView(); break;
                case 'tracking': content += TrackingView(); break;
                case 'profile': content += ProfileView(); break;
                case 'companies': content += CompaniesView(); break;
                case 'employer_auth': content += EmployerAuthView(); break;
                case 'employer_dashboard': content += EmployerDashboardView(); break;
                case 'employer_jobs': content += EmployerJobsView(); break;
                case 'employer_create_job': content += EmployerCreateJobView(); break;
                case 'employer_applicants': content += EmployerApplicantsView(); break;
                case 'employer_candidate': content += EmployerCandidateView(); break;
                case 'employer_talent': content += EmployerTalentView(); break;
                case 'employer_ads': content += EmployerAdsView(); break;
                case 'public_company': content += PublicCompanyView(); break;
                case 'nova_jobs': content += NovaJobsView(); break;
                case 'featured_companies': content += FeaturedCompaniesView(); break;
                case 'loading': content += LoadingView(); break;
                default: content += HomeView();
            }
            content += '</main>';

            // Website footer for public / candidate-facing pages.
            if (!['auth','employer_auth','employer_dashboard','employer_jobs','employer_create_job','employer_applicants','employer_candidate','employer_talent','employer_ads','loading'].includes(state.view)) {
                content += Footer();
            }

            // Floating utilities: back-to-top sits above the support mascot.
            content += BackToTopButton();
            content += SupportWidget();

            root.innerHTML = content;
            updateBackToTopVisibility();
        }

        // Initial render
        render();
        window.addEventListener('scroll', updateBackToTopVisibility, { passive: true });

    </script>

    <script>
      // GA4 interaction tracking for the static demo.
      // Sends only a short UI label and current view; never form-field values.
      document.addEventListener('click', function (event) {
        const el = event.target.closest('button, a');
        if (!el || typeof gtag !== 'function') return;
        const label = (el.innerText || el.getAttribute('aria-label') || 'interaction')
          .replace(/\s+/g, ' ').trim().slice(0, 80);
        if (!label) return;
        gtag('event', 'ui_click', {
          ui_label: label,
          app_view: (window.state && state.view) ? state.view : 'unknown'
        });
      });
    </script>
</body>
</html>
