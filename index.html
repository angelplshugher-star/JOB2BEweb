                                        <button class="absolute right-2 top-1/2 -translate-y-1/2 text-[#FF3F70] p-1">
                                            ${I.Send({size: 16})}

                                    </div>

                                        <p class="font-bold text-slate-700 mb-1">Q: AI Matching ทำงานอย่างไร?</p>

                                    </div>
                                    <div class="p-3 bg-slate-50 rounded-xl border border-slate-100 text-xs">

                                        <p class="text-slate-500">ผู้หางานสามารถใช้บริการวิเคราะห์และสมัครงานได้ฟรี 100%</p>

                                </div>
                            ` : `
                                <div class="space-y-2">
                                    <button onclick="setSupportSubView('chat')" class="w-full p-3 bg-gradient-to-r from-pink-50 to-orange-50 hover:from-pink-100 hover:to-orange-100 border border-pink-100 rounded-2xl flex items-center gap-3 text-left transition-all group">

                    <button 
                        onclick="toggleSupportMenu()" 
                        class="relative cursor-pointer focus:outline-none transition-transform hover:scale-110 active:scale-95 group"

                            />

        function render() {
            const root = document.getElementById('root');
            let content = '';

            // Render Navbar if not in specific views
            if (!['auth','search_mode','assessment','company_assessment','job_detail','employer_auth','employer_dashboard','employer_jobs','employer_create_job','employer_applicants','employer_candidate','employer_talent','employer_ads','public_company','nova_jobs','featured_companies'].includes(state.view)) {
                content += Navbar();
            }

            content += '<main class="flex-grow">';
            switch(state.view) {
                case 'home': content += HomeView(); break;
                case 'auth': content += AuthView(); break;
                case 'search_mode': content += SearchModeView(); break;
                case 'job_search': content += JobSearchView(); break;
                case 'job_detail': content += JobDetailView(); break;
                case 'assessment': 
                case 'assessment_result': content += AssessmentResultView(); break;
                case 'company_assessment': content += CompanyAssessmentView(); break;
                case 'tracking': content += TrackingView(); break;
                case 'profile': content += ProfileView(); break;
                case 'companies': content += CompaniesView(); break;
                case 'employer_auth': content += EmployerAuthView(); break;
                case 'employer_dashboard': content += EmployerDashboardView(); break;
                case 'employer_jobs': content += EmployerJobsView(); break;
                case 'employer_create_job': content += EmployerCreateJobView(); break;
                case 'employer_applicants': content += EmployerApplicantsView(); break;
                case 'employer_candidate': content += EmployerCandidateView(); break;
                case 'employer_talent': content += EmployerTalentView(); break;
                case 'employer_ads': content += EmployerAdsView(); break;
                case 'public_company': content += PublicCompanyView(); break;
                case 'nova_jobs': content += NovaJobsView(); break;
                case 'featured_companies': content += FeaturedCompaniesView(); break;
                case 'loading': content += LoadingView(); break;
                default: content += HomeView();
            }
            content += '</main>';

            // Floating Bottom-Right Support Widget
            content += SupportWidget();

            root.innerHTML = content;
        }

        // Initial render
        render();

    </script>

    <script>
      // GA4 interaction tracking for the static demo.
      // Sends only a short UI label and current view; never form-field values.
      document.addEventListener('click', function (event) {
        const el = event.target.closest('button, a');
        if (!el || typeof gtag !== 'function') return;
        const label = (el.innerText || el.getAttribute('aria-label') || 'interaction')
          .replace(/\s+/g, ' ').trim().slice(0, 80);
        if (!label) return;
        gtag('event', 'ui_click', {
          ui_label: label,
          app_view: (window.state && state.view) ? state.view : 'unknown'
        });
      });
    </script>
</body>
